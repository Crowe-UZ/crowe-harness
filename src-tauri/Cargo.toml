[package]
name = "crowe-harness"
version = "0.1.0"
description = "Crowe Harness — desktop AI development workspace"
authors = ["Crowe"]
edition = "2021"
# MSRV. Tauri 2 itself requires >= 1.77.2; 1.85 is the oldest toolchain we
# support (the pinned toolchain in rust-toolchain.toml is `stable`).
rust-version = "1.85"
license = "UNLICENSED"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "crowe_harness_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
ignore = "0.4"
semver = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["process", "io-util", "rt", "time", "sync", "macros"] }
memchr = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# panic = "unwind" (the default) on purpose: a panic in a background task
# (e.g. a session/process supervisor thread) must not abort the whole UI
# process, and Drop impls (kill_on_drop, Job Object handles, temp files)
# must run during unwinding.
# Strip only debuginfo: keep the symbol table so release crash reports
# still have usable function names in backtraces.
strip = "debuginfo"

[target."cfg(windows)".dependencies]
win32job = "2"

[dev-dependencies]
tempfile = "3"
