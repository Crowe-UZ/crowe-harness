[package]
name = "crowe-harness"
version = "0.1.0"
description = "Crowe Harness — desktop AI development workspace"
authors = ["Crowe"]
edition = "2021"
# MSRV. Tauri 2 itself requires >= 1.77.2; `pgp` 0.20 (installer manifest
# signature) requires 1.88, the oldest toolchain we support (the pinned
# toolchain in rust-toolchain.toml is `stable`).
rust-version = "1.88"
license = "UNLICENSED"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "crowe_harness_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
ignore = "0.4"
semver = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["process", "io-util", "rt", "time", "sync", "macros", "fs"] }
memchr = "2"
# In-app Claude Code installer (src/installer). HTTPS via rustls with the
# `ring` provider (pure Rust + asm, builds on MSVC without OpenSSL/cmake) and
# the OS certificate store (rustls-platform-verifier, pulled in by reqwest).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Pure-Rust OpenPGP (detached signature over the release manifest).
pgp = { version = "0.20", default-features = false }
subtle = "2"

[lints.rust]
# `deny` (not `forbid`) so that the single FFI module
# `installer/sys_windows.rs` can opt in with `#![allow(unsafe_code)]`
# (WinVerifyTrust, IsWow64Process2, GetDiskFreeSpaceExW). Nothing else may.
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# panic = "unwind" (the default) on purpose: a panic in a background task
# (e.g. a session/process supervisor thread) must not abort the whole UI
# process, and Drop impls (kill_on_drop, Job Object handles, temp files)
# must run during unwinding.
# Strip only debuginfo: keep the symbol table so release crash reports
# still have usable function names in backtraces.
strip = "debuginfo"

[target."cfg(windows)".dependencies]
win32job = "2"
# Fresh PATH / variables from HKCU and HKLM `Environment` (safe API, no unsafe here).
winreg = "0.55"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",
  "Win32_Security_Cryptography_Sip",
  "Win32_Security_WinTrust",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
